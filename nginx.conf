# Coastline prototype — Nginx server block.
# Loaded as a template; ${PORT} is substituted at container start.

server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Cross-origin iframe embedding ----
    # Allow embedding from any origin (prototype showcase).
    # Tighten frame-ancestors in production.
    add_header Content-Security-Policy "frame-ancestors *;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: X-Frame-Options is intentionally omitted so it does not block
    # cross-origin embedding. CSP frame-ancestors is the modern equivalent.

    # ---- Cache rules ----
    # Hashed asset bundles can be cached aggressively.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html should always be re-validated so updates roll out instantly.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback — single-page app routes to index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Disable server tokens.
    server_tokens off;
}
